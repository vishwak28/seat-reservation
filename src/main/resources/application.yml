spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seatdb}
    username: ${DB_USER:seat}
    password: ${DB_PASSWORD:seat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db