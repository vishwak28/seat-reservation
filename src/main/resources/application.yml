spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seatdb}
    username: ${DB_USER:seat}
    password: ${DB_PASSWORD:seat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000

server:
  port: ${PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789}
    admin-secret: ${ADMIN_SECRET:dev-admin-secret}
    token-ttl-minutes: ${JWT_TTL_MINUTES:720}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db