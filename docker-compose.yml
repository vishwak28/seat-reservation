services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatdb
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seatdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: