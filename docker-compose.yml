services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatdb
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seatdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/seatdb
      DB_USER: seat
      DB_PASSWORD: seat
    ports:
      - "8080:8080"

volumes:
  pgdata: